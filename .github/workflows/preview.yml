name: preview

on:
  issues:
    types: [opened, edited, reopened, labeled]
  # Re-run by hand (Actions tab), e.g. after changing the watcher: one issue, or all if left empty.
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (empty: all open subscriptions)"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: preview-${{ github.event.issue.number || inputs.issue || 'all' }}
  cancel-in-progress: true

jobs:
  preview:
    # Only subscription issues; keep the label in sync with `label` in config.yml.
    # The issue body is untrusted: it's never interpolated here, only read by the script via the API.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'watch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check out state (data branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth=1 --branch data "$url" data || mkdir -p data

      - run: pip install --quiet -r requirements.txt

      - name: Preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          if [ -n "$ISSUE" ]; then
            python -m watcher preview --issue "$ISSUE"
          else
            python -m watcher preview --all
          fi
